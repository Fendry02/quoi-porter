<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Qu'est-ce que je mets ?</title>
    <meta name="description" content="Ce qu'il faut porter aujourd'hui et demain, selon la météo." />
    <meta name="color-scheme" content="dark light" />

    <!-- SVG plutôt que PNG : une seule source, nette à toutes les tailles, et
         qui suit le thème clair ou sombre du système. -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />

    <!-- Ces balises ne servent que si la page est hébergée quelque part : un
         lien vers le dépôt GitHub, lui, est mis en carte par GitHub à partir
         de la description du dépôt, et ignore tout ce qui suit.
         L'image pointe vers le fichier brut du dépôt pour être absolue, comme
         le veulent Twitter et Facebook, sans dépendre d'un hébergement. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Qu'est-ce que je mets ?" />
    <meta
      property="og:description"
      content="Ce qu'il faut porter aujourd'hui et demain, selon la météo. La tenue en premier et entière, l'heure de chaque averse, et un aveu quand les modèles ne s'accordent pas."
    />
    <meta
      property="og:image"
      content="https://raw.githubusercontent.com/Fendry02/quoi-porter/main/media/apercu-beau-temps.jpg"
    />
    <meta property="og:image:alt" content="« T-shirt et short. » sur un ciel nuageux" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.185.1/build/three.module.js"
        }
      }
    </script>
  </head>

  <body>
    <!-- La scène. Purement décorative : tout ce qu'elle dit est aussi écrit. -->
    <canvas id="sky" aria-hidden="true"></canvas>

    <!--
      Piste de défilement : deux écrans de haut, invisible. C'est elle qui donne
      au navigateur de quoi faire défiler, pendant que le contenu reste fixe.
    -->
    <div id="track" aria-hidden="true">
      <div class="track__stop"></div>
      <div class="track__stop"></div>
    </div>

    <header class="masthead">
      <button
        type="button"
        id="place-toggle"
        class="place"
        aria-expanded="false"
        aria-controls="place-panel"
      >
        <span class="place__pin" aria-hidden="true"></span>
        <span id="place-name">Localisation…</span>
      </button>

      <div id="place-panel" class="finder" hidden>
        <form id="place-form" class="finder__form" role="search">
          <label class="visually-hidden" for="place-input">Ville</label>
          <input
            id="place-input"
            class="finder__input"
            type="search"
            name="ville"
            placeholder="Nantes, Lisbonne, Oslo…"
            autocomplete="off"
            enterkeyhint="search"
          />
          <button type="submit" class="finder__submit">Chercher</button>
        </form>
        <p id="place-status" class="finder__status" role="status" aria-live="polite"></p>
        <ul id="place-results" class="finder__results"></ul>
      </div>
    </header>

    <main id="stage">
      <article class="day day--today" id="day-today" aria-label="Aujourd’hui"></article>
      <article class="day day--tomorrow" id="day-tomorrow" aria-label="Demain"></article>
      <div id="state" class="state" hidden></div>
    </main>

    <button type="button" id="teaser" class="teaser" hidden></button>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
